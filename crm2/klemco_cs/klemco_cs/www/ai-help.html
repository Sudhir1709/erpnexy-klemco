{% raw %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klemco CRM Assistant</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --accent:#2563eb; --bot:#eef2ff; --user:#2563eb; --muted:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#111827; }
  .wrap { max-width:780px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
  header { padding:16px 20px; background:var(--panel); border-bottom:1px solid #e5e7eb; }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  #status { font-size:11px; padding:2px 8px; border-radius:10px; background:#fef3c7; color:#92400e; }
  #status.live { background:#dcfce7; color:#166534; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .msg.bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user { background:var(--user); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg strong { font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 8px; }
  .chip { font-size:12px; border:1px solid #d1d5db; background:#fff; border-radius:14px; padding:5px 10px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid #e5e7eb; }
  input { flex:1; padding:11px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { padding:11px 18px; background:var(--accent); color:#fff; border:none; border-radius:10px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .typing { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Klemco CRM Assistant <span id="status">checking…</span></h1>
    <div class="sub">Ask about how to use the CRM, or about your live data. Answers respect your permissions.</div>
  </header>
  <div id="log"></div>
  <div class="chips">
    <span class="chip">How many open complaints?</span>
    <span class="chip">List customers</span>
    <span class="chip">How do I create a sales order?</span>
    <span class="chip">How many sales orders?</span>
  </div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Type your question…" />
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const CSRF = "{% endraw %}{{ csrf_token }}{% raw %}";
const log = document.getElementById('log');
const history = [];

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.innerHTML = render(text);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function render(t) {
  return (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}

async function call(method, body) {
  const r = await fetch('/api/method/klemco_cs.ai_assistant.api.' + method, {
    method:'POST', headers:{'Content-Type':'application/json','X-Frappe-CSRF-Token':CSRF},
    body: JSON.stringify(body || {})
  });
  const j = await r.json();
  return j.message;
}

async function send(text) {
  if (!text.trim()) return;
  add('user', text); history.push({role:'user', content:text});
  document.getElementById('send').disabled = true;
  const t = add('bot', 'thinking…'); t.classList.add('typing');
  try {
    const res = await call('chat', {message:text, history: JSON.stringify(history.slice(0,-1))});
    t.classList.remove('typing'); t.innerHTML = render(res.reply);
    history.push({role:'assistant', content:res.reply});
  } catch (e) {
    t.classList.remove('typing'); t.innerHTML = '⚠️ ' + (e.message || 'request failed');
  }
  document.getElementById('send').disabled = false;
  document.getElementById('q').focus();
}

document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('q'); const v = q.value; q.value = ''; send(v);
});
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => send(c.textContent)));

(async () => {
  add('bot', "Hi! I'm the Klemco CRM Assistant. Ask me how to use the CRM, or about your live data — e.g. *how many open complaints?*");
  try {
    const s = await call('status', {});
    const el = document.getElementById('status');
    if (s.configured) { el.textContent = 'live · ' + s.model; el.classList.add('live'); }
    else el.textContent = 'demo mode (no API key)';
  } catch(e) { document.getElementById('status').textContent = 'offline'; }
})();
</script>
</body>
</html>{% endraw %}
